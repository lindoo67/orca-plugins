<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scratchpad</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --surface: #202123; --text: #e4e4e7; --muted: #8e8e96; --border: #38393c; --outside: #17181a; --paper: #3a3022; --fold: #5a4a33; --ink: #f0e6cf; --quiet-ink: #b0a284; --accent: #e6c884; --box: #9c8c6c; --checked: #d3b57b; --hover: #ffffff0a; --rule: #ffffff14; --focus: #e9c77e; --note-scheme: dark; }
    :root[data-theme="light"] { --surface: #f5f5f3; --text: #353536; --muted: #77777a; --border: #dcdcd8; --outside: #e9e9e5; --paper: #fdf6dc; --fold: #ecdfb4; --ink: #3f3422; --quiet-ink: #8a7650; --accent: #8a6d3b; --box: #a8936a; --checked: #8a6d3b; --hover: #00000008; --rule: #00000010; --focus: #825c07; --note-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 8px; background: var(--background, var(--outside)); color: var(--foreground, var(--text)); }
    button { font: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible, [contenteditable]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
    .preview { max-width: 600px; margin: auto; }
    .preview-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; color: var(--muted); font-size: 11px; }
    .preview-label { letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
    .theme { color: var(--foreground, var(--text)); background: transparent; border: 1px solid var(--border); padding: 6px 9px; border-radius: 6px; font-size: 11px; }
    .panel { color-scheme: var(--note-scheme); background: var(--orca-background, var(--surface)); border: 1px solid var(--border); border-radius: 6px; padding: 8px; }
    .paper { position: relative; background: var(--paper); color: var(--ink); min-height: 440px; padding: 22px 18px 16px; display: flex; flex-direction: column; }
    .paper::before { content: ""; position: absolute; top: 0; right: 0; width: 26px; height: 26px; background: linear-gradient(to bottom left, var(--surface) 50%, var(--fold) 50%); }
    .kicker { margin: 0; font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--quiet-ink); }
    .title { margin: 6px 0 0; font-family: "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive; font-weight: 400; font-size: 30px; line-height: 1.1; color: var(--accent); }
    .squiggle { display: block; width: 108px; height: 8px; margin: 2px 0 18px; color: var(--accent); }
    .rows { margin: 0; padding: 0; list-style: none; }
    .row { display: flex; align-items: flex-start; gap: 10px; padding: 6px 10px; border-radius: 6px; }
    .row:hover, .row:focus-within { background: var(--hover); }
    .tick { appearance: none; flex: 0 0 18px; width: 18px; height: 18px; margin: 2px 0 0; border: 1.5px solid var(--box); border-radius: 4px; background: transparent; cursor: pointer; position: relative; }
    .tick:checked { background: var(--checked); border-color: var(--checked); }
    .tick:checked::after { content: ""; position: absolute; left: 5px; top: 1px; width: 4px; height: 9px; border: solid var(--paper); border-width: 0 2px 2px 0; transform: rotate(45deg); }
    .line { flex: 1; min-width: 0; font-size: 14px; line-height: 1.55; overflow-wrap: anywhere; white-space: pre-wrap; outline: none; }
    .remove { flex: 0 0 auto; border: 0; background: transparent; color: var(--quiet-ink); padding: 0 2px; font-size: 16px; line-height: 1.3; opacity: 0; }
    .row:hover .remove, .row:focus-within .remove, .remove:focus-visible { opacity: 1; }
    .remove:hover { color: var(--ink); }
    .composer .tick-ghost { flex: 0 0 18px; height: 18px; margin-top: 2px; border: 1.5px dashed var(--box); border-radius: 4px; opacity: .6; }
    .composer input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 14px; line-height: 1.55; padding: 0; outline: none; }
    .composer input::placeholder { color: var(--quiet-ink); }
    .done-section { margin-top: 18px; border-top: 1px solid var(--rule); padding-top: 10px; }
    .done-section[hidden] { display: none; }
    .done-head { display: flex; justify-content: space-between; align-items: center; padding: 0 10px; }
    .toggle, .clear { border: 0; background: transparent; color: var(--quiet-ink); font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 4px 0; }
    .toggle:hover, .clear:hover { color: var(--ink); }
    .toggle::before { content: "▸"; display: inline-block; margin-right: 6px; transition: transform .15s; }
    .toggle[aria-expanded="true"]::before { transform: rotate(90deg); }
    .done .line { color: var(--quiet-ink); text-decoration: line-through; text-decoration-thickness: 1px; }
    .legend { display: flex; gap: 14px; margin: 18px 10px 0; padding-top: 12px; border-top: 1px solid var(--rule); font-size: 11px; color: var(--quiet-ink); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend svg { width: 12px; height: 12px; }
    .paper-foot { margin-top: auto; padding: 18px 10px 0; display: flex; justify-content: space-between; align-items: flex-end; font-size: 11px; color: var(--quiet-ink); }
    .paper-foot svg { width: 22px; height: 22px; color: var(--quiet-ink); }
    .hint { margin: 13px 6px 0; text-align: center; font-size: 11px; line-height: 1.6; color: var(--muted); }
    .done-section[hidden], .rows[hidden] { display: none; }
    .disclosure { color: var(--foreground, var(--muted)); margin: 13px 6px 0; font-size: 11px; line-height: 1.6; }
    @media (prefers-reduced-motion: reduce) { .toggle::before { transition: none; } }
  </style>
</head>
<body>
  <main class="preview">
    <section class="panel" aria-label="Scratchpad editor">
      <div class="paper">
        <p class="kicker">Scratchpad</p>
        <p id="status" role="status">Loading…</p>
        <button id="retry" type="button" hidden>Retry</button>
        <fieldset id="items" disabled style="border:0;padding:0;margin:0;min-width:0">
        <ul class="rows open" aria-label="Open items"></ul>
        <div class="row composer">
          <span class="tick-ghost" aria-hidden="true"></span>
          <input type="text" placeholder="Add something…" aria-label="Add an item">
        </div>
        <section class="done-section" hidden>
          <div class="done-head">
            <button class="toggle" type="button" aria-expanded="false" aria-controls="done-list">Done · 0</button>
            <button class="clear" type="button">Clear</button>
          </div>
          <ul class="rows done" id="done-list" aria-label="Done items" hidden></ul>
        </section>
        </fieldset>
        <div class="paper-foot">
          <span class="count">0 little things left</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 14.5c1 1.4 2.4 2 4 2s3-.6 4-2"/><path d="M9 9.5h.01M15 9.5h.01" stroke-width="2"/></svg>
        </div>
      </div>
      <p class="hint">Click to edit · Enter to finish · Shift+Enter for a new line<br>Backspace on an empty item to remove it</p>
    </section>
  </main>
  <script>
'use strict';
class ScratchpadDocument {
  constructor(orca, view) {
    this.orca = orca;
    this.view = view;
    this.version = null;
    this.baseline = null;
    this.pending = null;
    this.sent = null;
    this.readOnly = true;
    this.conflict = false;
  }
  parse(text) {
    if (!text.trim()) return [];
    const value = JSON.parse(text);
    if (value?.version !== 1 || !Array.isArray(value.items) ||
        value.items.some(item => !item || typeof item.id !== 'string' || typeof item.text !== 'string' || typeof item.done !== 'boolean') ||
        new Set(value.items.map(item => item.id)).size !== value.items.length) {
      throw new Error('Invalid scratchpad file. Switch to Source to fix it.');
    }
    return value.items;
  }
  receive(doc) {
    if (!Number.isSafeInteger(doc?.version) || doc.content?.kind !== 'text') return;
    this.version = doc.version;
    const text = doc.content.text;
    if (text === this.sent) {
      this.baseline = text;
      this.readOnly = !!doc.readOnly;
      this.view.readOnly(this.readOnly);
      return;
    }
    if (this.pending !== null || this.sent !== null) {
      if (text === this.baseline) return;
      this.conflict = true;
      this.view.status('File changed while editing. Copy your edits, then reopen the file.', false);
      return;
    }
    try {
      const rows = this.parse(text);
      this.baseline = text;
      this.readOnly = !!doc.readOnly;
      this.view.render(rows);
      this.view.readOnly(this.readOnly);
      this.view.status(this.readOnly ? 'Read-only file' : 'Save with ⌘S / Ctrl+S', false);
    } catch (error) {
      this.readOnly = true;
      this.view.readOnly(true);
      this.view.status(error.message, false);
    }
  }
  load() {
    if (!this.orca?.document) {
      this.view.status('Create or open a .scratchpad file in Orca.', false);
      return;
    }
    this.orca.document.onDidChange(doc => this.receive(doc));
    this.orca.on('editor.flush', () => this.flush());
  }
  save(items) {
    if (this.readOnly) return;
    this.pending = JSON.stringify({ version: 1, items }, null, 2) + '\n';
    this.view.status(this.conflict ? 'File changed. Copy your edits before reopening.' : 'Editing…', false);
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush().catch(() => {}), 100);
  }
  flush() {
    if (this.active) return this.active;
    this.active = this.drain().finally(() => { this.active = null; });
    return this.active;
  }
  async drain() {
    while (this.pending !== null) {
      if (this.readOnly || this.conflict) throw new Error('Cannot update this file.');
      const text = this.pending;
      this.pending = null;
      this.sent = text;
      try {
        await this.orca.document.applyEdit({ baseVersion: this.version, content: { kind: 'text', text } });
        this.baseline = text;
        this.view.status('Save with ⌘S / Ctrl+S', false);
      } catch (error) {
        this.pending ??= text;
        this.conflict ||= error.code === 'conflict';
        this.view.status(`Edits not applied: ${error.message || 'Retry'}`, !this.conflict);
        throw error;
      } finally { this.sent = null; }
    }
  }
  retry() { return this.flush().catch(() => {}); }
}
if (typeof module !== 'undefined') module.exports = { ScratchpadDocument };

</script>
  <script>

    (() => {
      'use strict';

      const openList = document.querySelector('.rows.open');
      const doneList = document.querySelector('.rows.done');
      const doneSection = document.querySelector('.done-section');
      const toggle = document.querySelector('.toggle');
      const composer = document.querySelector('.composer input');
      const count = document.querySelector('.count');

      function updateDone() {
        const n = doneList.children.length;
        doneSection.hidden = n === 0;
        if (n === 0) {
          toggle.setAttribute('aria-expanded', 'false');
          doneList.hidden = true;
        }
        toggle.textContent = `Done · ${n}`;
        const open = openList.children.length;
        count.textContent = `${open} little ${open === 1 ? 'thing' : 'things'} left`;
        save();
      }
      function focusEnd(el) {
        el.focus();
        const range = document.createRange();
        range.selectNodeContents(el);
        range.collapse(false);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      }
      function makeRow(text, done = false) {
        const row = document.createElement('li');
        row.className = 'row';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'tick';
        checkbox.checked = done;
        const line = document.createElement('span');
        line.className = 'line';
        line.contentEditable = 'plaintext-only';
        line.setAttribute('role', 'textbox');
        line.setAttribute('aria-label', 'Item text');
        line.textContent = text;
        row.dataset.id = crypto.randomUUID();
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'remove';
        remove.textContent = '×';
        const label = () => {
          const name = line.textContent.trim() || 'item';
          checkbox.setAttribute('aria-label', `${checkbox.checked ? 'Mark open' : 'Mark done'}: ${name}`);
          remove.setAttribute('aria-label', `Delete: ${name}`);
        };
        label();
        line.addEventListener('input', () => { label(); save(); });
        checkbox.addEventListener('change', () => {
          (checkbox.checked ? doneList : openList)[checkbox.checked ? 'prepend' : 'append'](row);
          label();
          updateDone();
          if (checkbox.checked && doneList.hidden) composer.focus();
          else checkbox.focus();
        });
        remove.addEventListener('click', () => { row.remove(); updateDone(); composer.focus(); });
        line.addEventListener('keydown', event => {
          if (event.isComposing) return;
          if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            line.blur();
            composer.focus();
          } else if (event.key === 'Backspace' && !line.textContent) {
            event.preventDefault();
            const prev = row.previousElementSibling?.querySelector('.line');
            row.remove();
            updateDone();
            prev ? focusEnd(prev) : composer.focus();
          }
        });
        line.addEventListener('blur', () => { if (!line.textContent.trim()) { row.remove(); updateDone(); } });
        row.append(checkbox, line, remove);
        return row;
      }

      composer.addEventListener('keydown', event => {
        if (event.isComposing) return;
        if (event.key === 'Enter' && composer.value.trim()) {
          openList.append(makeRow(composer.value.trim()));
          composer.value = '';
          updateDone();
        } else if (event.key === 'Backspace' && !composer.value && openList.lastElementChild) {
          event.preventDefault();
          focusEnd(openList.lastElementChild.querySelector('.line'));
        }
      });
      toggle.addEventListener('click', () => {
        const open = toggle.getAttribute('aria-expanded') !== 'true';
        toggle.setAttribute('aria-expanded', String(open));
        doneList.hidden = !open;
      });
      document.querySelector('.clear').addEventListener('click', () => {
        doneList.replaceChildren();
        updateDone();
        composer.focus();
      });

      const status = document.querySelector('#status');
      const retry = document.querySelector('#retry');
      const items = document.querySelector('#items');
      let ready = false;
      const store = new ScratchpadDocument(window.orca, {
        readOnly(value) { items.disabled = value; openList.querySelectorAll('.line').forEach(line => { line.contentEditable = value ? 'false' : 'plaintext-only'; }); doneList.querySelectorAll('.line').forEach(line => { line.contentEditable = value ? 'false' : 'plaintext-only'; }); },
        status(message, failed) { status.textContent = message; retry.hidden = !failed; },
        render(rows) {
          ready = false;
          openList.replaceChildren(); doneList.replaceChildren();
          for (const item of rows) {
            const row = makeRow(item.text, item.done);
            row.dataset.id = item.id;
            (item.done ? doneList : openList).append(row);
          }
          updateDone(); ready = true;
        }
      });
      function save() {
        if (!ready) return;
        store.save([...openList.children, ...doneList.children].map(row => ({
          id: row.dataset.id,
          text: row.querySelector('.line').textContent,
          done: row.querySelector('.tick').checked
        })));
      }
      retry.addEventListener('click', () => store.retry());
      store.load();
      const root = document.documentElement;
      const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme(mode) {
        root.dataset.theme = mode;
        const next = mode === 'light' ? 'dark' : 'light';

      }
      function followHostTheme() {
        const scheme = getComputedStyle(root).colorScheme;
        applyTheme(root.classList.contains('light') ? 'light'
          : root.classList.contains('dark') ? 'dark'
          : scheme === 'light' || scheme === 'dark' ? scheme
          : systemTheme.matches ? 'dark' : 'light');
      }

      systemTheme.addEventListener('change', followHostTheme);
      window.orca?.on?.('theme', ({ colorScheme }) => {
        if (colorScheme === 'light' || colorScheme === 'dark') applyTheme(colorScheme);
        else followHostTheme();
      });
      new MutationObserver(followHostTheme).observe(root, { attributes: true, attributeFilter: ['class', 'style'] });
      followHostTheme();
    })();

</script>
</body>
</html>
